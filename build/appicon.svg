<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" fill="none" viewBox="0 0 1024 1024">
  <!-- gaea 盖亚 — 大地女神：翡翠球体 + 破土嫩芽 + 灵感星芒 -->
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- 深色圆角底板 -->
  <rect width="1024" height="1024" rx="205" fill="#0f172a"/>
  <!-- 大地球体 -->
  <circle cx="512" cy="560" r="330" fill="url(#g)"/>
  <ellipse cx="360" cy="420" rx="120" ry="68" fill="#d1fae5" opacity="0.5" transform="rotate(-20 360 420)"/>
  <!-- 破土嫩芽：茎 + 两片叶 -->
  <line x1="512" y1="840" x2="512" y2="500" stroke="url(#leaf)" stroke-width="38" stroke-linecap="round"/>
  <ellipse cx="400" cy="640" rx="105" ry="57" fill="url(#leaf)" transform="rotate(-35 400 640)"/>
  <ellipse cx="632" cy="480" rx="110" ry="60" fill="#a7f3d0" transform="rotate(25 632 480)"/>
  <!-- 灵感核心 -->
  <circle cx="720" cy="250" r="42" fill="#ecfdf5"/>
  <circle cx="720" cy="250" r="90" fill="#a7f3d0" opacity="0.3"/>
</svg>

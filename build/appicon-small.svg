<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="gaea">
  <!-- gaea 盖亚 — 地核 G 的小尺寸简化变体（派生资产，仅供 ICO 的 16/24/32px 帧）
       相对主图 appicon.svg 的三处调整：
         1. 环加粗 48 → 64
         2. 核放大 r 50 → 62
         3. 去掉 halo 光晕（小尺寸下只会让核边缘发灰）
       线宽衔接：本变体 32px 的环宽 4.0px ≈ 主图 48px 的环宽 4.5px，
       故 ICO 取 16/24/32 用本变体、48 及以上用主图，字重过渡平滑。 -->
  <defs>
    <linearGradient id="gaea-small-ring" x1="18%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#7EE8C4"/>
      <stop offset="55%" stop-color="#2DD4A8"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="gaea-small-core" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="42%" stop-color="#F3E6C4"/>
      <stop offset="100%" stop-color="#D4B896"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="#0B1210"/>
  <path d="M319 142.4 A134 134 0 1 0 382 256" fill="none" stroke="url(#gaea-small-ring)" stroke-width="64" stroke-linecap="round"/>
  <path d="M268 256 H382" fill="none" stroke="url(#gaea-small-ring)" stroke-width="64" stroke-linecap="round"/>
  <circle cx="270" cy="256" r="62" fill="url(#gaea-small-core)"/>
</svg>

name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # dist/ 不入库（只提交 .gitkeep 占位）：main.go 的 go:embed all:dist
      # 要求该目录存在，fresh checkout 上 go build 才不炸；真实内容由
      # golangci 之外的发布流程（wails build）生成。
      - run: go build ./...

      - run: go vet ./...

      # 分类器夹具自测（2026-10-02）：分类逻辑本身也要有守卫——把真回归错判成 flaky
      # 比不分类更糟。9 组夹具（14 条断言）秒级跑完，windows-latest 自带 node。
      - name: Go flaky classifier selftest
        run: node scripts/classify-go-failures.mjs --selftest

      # 覆盖口径 = 全包（批次十三 P2 收口）：此前以「internal/tts 的 TestEdgeTTS 依赖
      # 外部网络」为由整包排除，而该测试**全仓零命中**（早已不存在）＝过期注释 +
      # 白丢覆盖。实测本机形态 `go test -count=1 ./internal/tts/...` 该包全绿，唯一
      # 外网项 TestLiveVoxCPM2 自带 HERDSMAN_LIVE=1 门自动 SKIP（默认不跑真机）。
      # 平台核对：internal/tts 无 //go:build 约束，但 sapi.go 用
      # syscall.SysProcAttr{HideWindow}（Windows-only 字段）⇒ 只能在 windows runner
      # 上编译/运行，本 job 正是 windows-latest（ubuntu 的 race job 不可纳入）。
      # 假红治理（2026-10-02，审计 X1-12 收口）：原先对全量「失败整批重试一次」——
      # 原注释自认「整批重试仍可能洗白真回归」，红灯因此不可信。现在只允许**在册
      # flaky 包**隔离复跑，判据在 scripts/go-known-flaky.txt（当前为空）：
      #   失败包集合 ⊆ 清单 → 只复跑这些包（绿则过、红则红）；
      #   出现清单外失败包 → 直接红，不重试。
      # 分类器：scripts/classify-go-failures.mjs（--selftest 9 组夹具），与前端 job 同款形态；
      # 首跑非零时带 --expect-failure：归不出失败包也不许静默放行（exit 1）。
      # 产物 go-test.json / go-test.err / scripts/go-retry-pkgs.txt 不入库（见 .gitignore）。
      - name: Go tests (registered flaky only)
        shell: bash
        run: |
          pkgs=$(go list ./...)
          if [ -z "$pkgs" ]; then
            echo "go list 无输出（模块解析失败？）——按红处理"
            exit 1
          fi
          set +e
          go test -json -count=1 $pkgs > go-test.json 2> go-test.err
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "go test 全绿"
            exit 0
          fi
          tail -n 100 go-test.err
          # 失败包进注解（-json 流里 Action:fail 事件；无登录也能从 check-runs API 看）
          grep -o '"Action":"fail","Package":"[^"]*"' go-test.json | head -15 | while IFS= read -r line; do echo "::error::$line"; done || true
          # 失败用例名与断言消息（Output 事件里 JSON 转义的 --- FAIL / 断言行）
          grep -o '"Output":"[^"]*\(--- FAIL\|_test.go:\)[^"]*"' go-test.json | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true
          # stderr 头部（setup/vet 失败形态：无 Output 事件、错误只在 err 流）
          head -8 go-test.err | while IFS= read -r line; do echo "::error::stderr: $line"; done || true
          node scripts/classify-go-failures.mjs go-test.json scripts/go-known-flaky.txt scripts/go-retry-pkgs.txt --expect-failure || exit 1
          echo "在册 flaky 隔离复跑："
          cat scripts/go-retry-pkgs.txt
          # shellcheck disable=SC2046
          go test -count=1 $(tr '\n' ' ' < scripts/go-retry-pkgs.txt)

      # Fresh-runner 金丝雀：genui/backup/attachment 三包只在干净 runner 上红
      # （本地+UTC+干净 APPDATA 均不复现），平文本全量输出走注解带回来定位。
      # exit 0：诊断步不拦门，真失败由后续全量测试步如实判红。
      - name: Fresh-runner canary (genui/backup/attachment)
        if: always() # 前序全量测试步红了也要跑：三包只在干净 runner 上红的诊断通道
        shell: bash
        run: |
          set +e
          go test -count=1 ./internal/gaea/genui/ ./internal/gaea/backup/ ./internal/gaea/attachment/ 2>&1 | tee canary.log
          grep -E '^(--- FAIL|FAIL|ok|panic)' canary.log | head -20 | while IFS= read -r line; do echo "::error::canary: $line"; done || true
          grep -E '[A-Za-z0-9_]+\.go:[0-9]+:' canary.log | head -20 | while IFS= read -r line; do echo "::error::canary: $line"; done || true
          # 全文进 Step Summary（运行页服务端渲染，免登录可读）
          { echo "## canary (genui/backup/attachment)"; echo '```'; tail -80 canary.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # internal/app 竞态用例 -race（审计 P0-2：comfyUI 进程引用三路并发写收口）。
      # internal/app 整包尚未跨平台（kernel32 原生采集/x/sys/windows），故 -race
      # 放在 windows runner 上跑（自带 gcc）；先用窄 -run 起步，逐步扩面，
      # TempDir 清理竞争 flaky 先例的用例不纳入。
      - name: Race detector (internal/app subset)
        shell: bash
        run: |
          command -v gcc >/dev/null 2>&1 || choco install mingw -y --no-progress
          CGO_ENABLED=1 go test -race -count=1 ./internal/app -run 'TestComfyUIProc'

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: --timeout=5m

      # T6-10.3 绑定面漂移检查：frontend/src/gaea/lib/bindingNames.ts 必须与
      # Go 侧全部导出绑定方法一致（gen_bindings -names 对照，不一致 exit 1）。
      # AppBindings 与 bindingNames 的类型级双向断言由 frontend job 的 tsc 承担。
      - name: Check bindings drift (bindingNames.ts vs Go surface)
        run: pwsh -NoProfile -File scripts/check-bindings-drift.ps1

  # S0.5 并发门禁：办公引擎核心包 -race（审计 P0 竞态回归防线）。
  # v4.331 扩面：小说 revolution 期新生包六件（chapter/analysis/promptstore/
  # novelgate/rewrite/characterstate——自动门/覆盖缓存/状态机的并发路径）。
  # internal/app 不进：race 下已知 TempDir 清理竞争 flaky 先例，扩面候单独评估
  #（其新增竞态用例改由上方 backend job 的 windows race step 承担）。
  # 独立 ubuntu job：windows-latest 无 gcc，-race 不可用；ubuntu-latest 自带 gcc。
  # 2026-09-27 修复：tool/builtin 的 Windows-only syscall（HideWindow/syscall.Handle）
  # 收进 build-tag 变体后，本 job 恢复可编译（此前 ubuntu 上结构性 build failed）。
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test -race (linux) with failure digest
        shell: bash
        run: |
          set +e
          go test -race -count=1 ./internal/gaea/agent/ ./internal/gaea/tool/ ./internal/gaea/control/ ./internal/novelstyle/ ./internal/novelcontext/ ./internal/narrative/ ./internal/chapter/ ./internal/analysis/ ./internal/promptstore/ ./internal/novelgate/ ./internal/rewrite/ ./internal/characterstate/ ./internal/gaea/fileutil/ 2>&1 | tee race.log
          code=${PIPESTATUS[0]}
          set -e
          if [ $code -ne 0 ]; then
            # 失败包/用例/断言消息进注解（check-runs API 免登录可见，2026-10-30 根修轮）
            grep -E '^(FAIL|--- FAIL|panic|# command-line)|^[[:space:]]+[A-Za-z0-9_]+\.go:[0-9]+:' race.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true
            # DATA RACE 块（读/写两处栈）：竞态根修要靠它定位共享内存
            grep -A14 'WARNING: DATA RACE' race.log | head -34 | while IFS= read -r line; do echo "::error::$line"; done || true
            # 兜底：竞态块若走了缓冲没被上面抓到，日志尾部必有现场
            tail -25 race.log | while IFS= read -r line; do echo "::error::tail: $line"; done || true
            { echo "## race.log tail"; echo '```'; tail -80 race.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # v4.371 起唯一 lockfile 是 pnpm-lock.yaml：npm ci 结构性跑不通
      #（审计 P0-1），改 pnpm + frozen-lockfile 保证 CI 与本地依赖树一致。
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # wailsjs 已入库（2026-10-30）：tsc/vite 的真依赖。曾经 CI 生成失败——
      # `wails generate module` 要编译 main 包，而 main→internal/app→x/sys/windows
      # 在 ubuntu 结构性不可编译；库化后漂移由 check-bindings-drift.ps1+tsc 双保险。
      - run: pnpm lint

      - run: pnpm build

      # 分类器夹具自测（批次十三 P3 收口）：本 job 注释此前自称分类器「含 4 组夹具
      # 自测」，实际**零自测**（grep selftest 零命中）。现状 = 8 组夹具 / 14 条断言，
      # 与后端 job 同款 `--selftest` 形态（分类器若把真回归错判成 flaky 比不分类更糟）。
      - name: Vitest flaky classifier selftest
        run: node scripts/classify-vitest-failures.mjs --selftest

      # 假红治理（2026-09-10 收口）：原先对全量套件无条件「失败重试一次」——
      # 真回归会被复跑洗白，红灯因此不可信。现在只允许**在册 flaky 文件**
      # 隔离复跑，判据在 frontend/known-flaky.txt（当前为空）：
      #   失败集合 ⊆ 清单 → 只复跑这些文件（绿则过、红则红）；
      #   出现清单外失败 → 直接红，不重试。
      # 分类器：frontend/scripts/classify-vitest-failures.mjs（--selftest 8 组 / 14 条断言）
      # 首跑非零时带 --expect-failure：归不出失败文件也不许静默放行（exit 1）。
      # 产物 vitest-report.json / vitest-retry-files.txt 不入库（见 .gitignore）。
      - name: Frontend tests (registered flaky only)
        shell: bash
        run: |
          set +e
          pnpm run test -- --reporter=json --outputFile=vitest-report.json
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "vitest 全绿"
            exit 0
          fi
          # 失败文件+首条断言消息进注解（check-runs API 免登录可见，2026-10-30）
          node -e 'const r=require("./vitest-report.json"); for (const f of (r.testResults||[])) for (const a of (f.assertionResults||[]).filter(x=>x.status==="failed").slice(0,8)) console.log("::error::"+f.name+" :: "+(a.fullName||a.title||"")+" :: "+String((a.failureMessages||[])[0]||"").replace(/\n/g," ").slice(0,260))' || true
          # 失败明细进 Step Summary（运行页免登录可读）
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("./vitest-report.json","utf8")); let s="## vitest failures\n"; for (const f of (r.testResults||[])) { const bad=(f.assertionResults||[]).filter(x=>x.status==="failed"); if (!bad.length) continue; s+="### "+f.name+"\n"; for (const a of bad) { s+="#### "+(a.fullName||a.title||"")+"\n```\n"+String((a.failureMessages||[])[0]||"").slice(0,1500)+"\n```\n"; } } fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY||"/dev/null", s)' || true
          node scripts/classify-vitest-failures.mjs vitest-report.json known-flaky.txt --expect-failure || exit 1
          echo "在册 flaky 隔离复跑："
          cat vitest-retry-files.txt
          # shellcheck disable=SC2046
          npx vitest run $(tr '\n' ' ' < vitest-retry-files.txt)

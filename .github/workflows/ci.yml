name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      # internal/tts 的 TestEdgeTTS 依赖外部网络，暂时排除
      - run: go test $(go list ./... | grep -v /internal/tts) -count=1

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 仓库按约定不提交 package-lock.json（.gitignore），用 npm install 而非 npm ci
      - run: npm install

      - run: npm run lint

      - run: npm run build

      # vitest 全量用例（此前未进 CI；E1-1 补齐）
      - run: npm run test

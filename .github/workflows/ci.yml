name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      # internal/tts 的 TestEdgeTTS 依赖外部网络，暂时排除
      # flaky 治理（2026-08-27）：整体失败后重试一次——filewatch 等时间敏感测试
      # 在 windows-latest 高负载下偶发假红（本地复跑即绿），重试可消除环境抖动；
      # 重试后仍失败则正常红，不掩盖真实缺陷。
      - name: Go tests (with flaky retry)
        shell: bash
        run: |
          pkgs=$(go list ./... | grep -v /internal/tts)
          if ! go test $pkgs -count=1; then
            echo "first run failed (possibly flaky), retrying once..."
            go test $pkgs -count=1
          fi

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      # T6-10.3 绑定面漂移检查：frontend/src/gaea/lib/bindingNames.ts 必须与
      # Go 侧全部导出绑定方法一致（gen_bindings -names 对照，不一致 exit 1）。
      # AppBindings 与 bindingNames 的类型级双向断言由 frontend job 的 tsc 承担。
      - name: Check bindings drift (bindingNames.ts vs Go surface)
        run: pwsh -NoProfile -File scripts/check-bindings-drift.ps1

  # S0.5 并发门禁：办公引擎核心包 -race（审计 P0 竞态回归防线）。
  # v4.331 扩面：小说 revolution 期新生包六件（chapter/analysis/promptstore/
  # novelgate/rewrite/characterstate——自动门/覆盖缓存/状态机的并发路径）。
  # internal/app 不进：race 下已知 TempDir 清理竞争 flaky 先例，扩面候单独评估。
  # 独立 ubuntu job：windows-latest 无 gcc，-race 不可用；ubuntu-latest 自带 gcc。
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test -race -count=1 ./internal/gaea/agent/ ./internal/gaea/tool/ ./internal/gaea/control/ ./internal/novelstyle/ ./internal/novelcontext/ ./internal/narrative/ ./internal/chapter/ ./internal/analysis/ ./internal/promptstore/ ./internal/novelgate/ ./internal/rewrite/ ./internal/characterstate/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json 已入库：npm ci 保证 CI 与本地依赖树一致。
      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # 假红治理（2026-09-10 收口）：原先对全量套件无条件「失败重试一次」——
      # 真回归会被复跑洗白，红灯因此不可信。现在只允许**在册 flaky 文件**
      # 隔离复跑，判据在 frontend/known-flaky.txt（当前为空）：
      #   失败集合 ⊆ 清单 → 只复跑这些文件（绿则过、红则红）；
      #   出现清单外失败 → 直接红，不重试。
      # 分类器：frontend/scripts/classify-vitest-failures.mjs（含 4 组夹具自测）。
      - name: Frontend tests (registered flaky only)
        shell: bash
        run: |
          set +e
          npm run test -- --reporter=json --outputFile=vitest-report.json
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "vitest 全绿"
            exit 0
          fi
          node scripts/classify-vitest-failures.mjs vitest-report.json known-flaky.txt || exit 1
          echo "在册 flaky 隔离复跑："
          cat vitest-retry-files.txt
          # shellcheck disable=SC2046
          npx vitest run $(tr '\n' ' ' < vitest-retry-files.txt)

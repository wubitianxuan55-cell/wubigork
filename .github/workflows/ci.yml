name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      # internal/tts 的 TestEdgeTTS 依赖外部网络，暂时排除
      - run: go test $(go list ./... | grep -v /internal/tts) -count=1

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  frontend:
    # 前端有预存 TS 编译错误（feature/mobile-remote 分支开发中间状态），修复前不阻塞整体
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

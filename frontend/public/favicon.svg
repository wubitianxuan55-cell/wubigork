<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 512 512" role="img" aria-label="gaea">
  <!-- gaea 盖亚 — 地核 G：轨道环抱活核，16px 仍读作 G -->
  <defs>
    <linearGradient id="gaea-ring" x1="18%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#7EE8C4"/>
      <stop offset="55%" stop-color="#2DD4A8"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="gaea-core" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="42%" stop-color="#F3E6C4"/>
      <stop offset="100%" stop-color="#D4B896"/>
    </radialGradient>
    <radialGradient id="gaea-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 轨道：302° → 0° 逆时针大弧 + 地平横杠 = G -->
  <path d="M319 142.4 A134 134 0 1 0 382 256" fill="none" stroke="url(#gaea-ring)" stroke-width="48" stroke-linecap="round"/>
  <path d="M268 256 H382" fill="none" stroke="url(#gaea-ring)" stroke-width="48" stroke-linecap="round"/>
  <!-- 活核 -->
  <circle cx="270" cy="256" r="78" fill="url(#gaea-halo)"/>
  <circle cx="270" cy="256" r="50" fill="url(#gaea-core)"/>
  <ellipse cx="256" cy="240" rx="16" ry="10" fill="#FFFDF7" opacity="0.55"/>
</svg>

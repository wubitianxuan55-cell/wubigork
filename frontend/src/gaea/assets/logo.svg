<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="gaea">
  <title>gaea — 大地女神</title>
  <defs>
    <!-- 主渐变：indigo → cyan -->
    <linearGradient id="gaea-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- 发光节点辉光 -->
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <!-- 轮廓渐变（深） -->
    <linearGradient id="contour-grad" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- ===== 外环（地球轨道） ===== -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#gaea-grad)" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#gaea-grad)" stroke-width="2" opacity="0.2"/>

  <!-- ===== 女神侧脸轮廓（左侧向上仰望） ===== -->
  <!-- 从颈底向上，经下颌、唇、鼻梁、额头、头顶，再往下流转为发丝 -->
  <path d="
    M 120 380
    C 130 340, 135 320, 145 300
    C 152 285, 158 275, 162 260
    C 165 245, 163 230, 158 215
    C 152 198, 148 185, 155 170
    C 165 152, 185 140, 210 135
    C 240 128, 270 135, 295 150
    C 315 162, 325 178, 330 195
    C 335 210, 338 230, 345 255
    C 352 280, 358 310, 362 340
    C 364 358, 362 372, 355 385
  "
  fill="none" stroke="url(#gaea-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 内层轮廓线（地形等高线 / 面部细节） -->
  <!-- 眉弓 -->
  <path d="M 155 180 C 175 170, 205 168, 225 175"
  fill="none" stroke="url(#contour-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- 鼻梁 → 下颌弧线 -->
  <path d="M 170 210 C 175 240, 170 265, 158 290"
  fill="none" stroke="url(#contour-grad)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- ===== 发丝/根系 垂落（右侧有机曲线 = 大地等高线） ===== -->
  <path d="M 295 150 C 310 168, 325 195, 335 230 C 345 265, 350 305, 348 345"
  fill="none" stroke="url(#gaea-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <path d="M 310 170 C 325 200, 340 235, 348 275 C 356 315, 358 350, 352 380"
  fill="none" stroke="url(#gaea-grad)" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

  <path d="M 322 195 C 338 225, 352 260, 358 300 C 364 340, 360 370, 350 395"
  fill="none" stroke="url(#gaea-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>

  <!-- 最内层细线 -->
  <path d="M 330 218 C 345 245, 358 278, 363 318"
  fill="none" stroke="url(#gaea-grad)" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

  <!-- ===== AI 智慧火花（头顶发光节点） ===== -->
  <circle cx="210" cy="120" r="40" fill="url(#spark-glow)"/>
  <circle cx="210" cy="120" r="9" fill="#22D3EE"/>
  <circle cx="210" cy="120" r="4" fill="#FFFFFF" opacity="0.8"/>

  <!-- ===== 大地节点（底部锚点） ===== -->
  <circle cx="120" cy="380" r="4" fill="#6366F1"/>
  <circle cx="355" cy="385" r="3" fill="#06B6D4" opacity="0.7"/>

  <!-- ===== 字标 ===== -->
  <text x="256" y="478" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="600" font-size="68" letter-spacing="0.04em"
        fill="#6366F1">
    gaea
  </text>
</svg>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link id="gaea-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gaea · 多功能 AI 助手</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background: #010409;
      }

      /* First paint before the bundle: a blurred thumbnail of the opening plate. BootSplash
         fades this layer out as soon as the sharp plate is decoded, so startup goes from soft
         to sharp instead of flashing a frozen frame. It sits above the React splash (z 1401)
         for exactly that cross-fade. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1401;
        overflow: hidden;
        background: #010409
          url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAAkAEADASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAAEDBAUGAgf/xAAnEAABAwMCBgIDAAAAAAAAAAABAAIDBAUREiEGMVFhcYETFCJBQv/EABgBAAMBAQAAAAAAAAAAAAAAAAEDBAAC/8QAHhEAAgMBAAIDAAAAAAAAAAAAAAECAzEREyESIkH/2gAMAwEAAhEDEQA/APEw1dhqVrU61ickLchoMXQjPRTIacvPJW1LZJpx+LCfSDajoYpywzpjPRJoKv6qzywHDmEKL9PTu4YRjyWAl2OkCKAu7BEgDNgpsgDW77KBMcnZdNcRyn1k+ltVRMRhuB3VzScPAkGaZjfaq2XGV39H0nmVErmkmXHtO+iwmases1tDZLZEWmaoBW74cgskZDdTXHuvF4ri/VpkkOAp0N4mgJdC848qW+ryL0U0WOvT1fiGissshw5rfCxFztdueT8U4CzlVxBNKAHuPc5Uaa6h7A0OI6rqirxr2C+x2YSayyE5MczXDyqepts8ROW58J8VjhuJT4ykdXSdchUv4MnStj+lXqOOaUSOA5oQklIgceqcMrxyKELAYusnmuHuOUIWMcFxBRrcP2hCAT//2Q==")
          center / cover no-repeat;
        opacity: 0;
        animation: bs-ignite 550ms ease-out 80ms forwards;
      }

      #boot-splash.is-handing-off {
        animation: bs-release 300ms ease forwards;
      }

      @keyframes bs-ignite {
        to {
          opacity: 1;
        }
      }

      @keyframes bs-release {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <script>try { performance.mark('gaea:boot') } catch { /* Marking is optional. */ }</script>
    <script>
      // Seed the runtime theme before React mounts.
      try {
        var mode = '';
        try { mode = localStorage.getItem('gaea-display-mode') || '' } catch (e) {}
        var light = mode === 'light';
        if (!light && mode === 'system') {
          try { light = !window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        }
        if (!light && mode === '') {
          var legacy = '';
          try { legacy = localStorage.getItem('gaea-dark') ?? localStorage.getItem('wubigork-dark') ?? '' } catch (e) {}
          light = legacy === '0';
        }
        if (light) document.documentElement.setAttribute('data-bs-light', '')
      } catch (e) { /* Dark is the safe fallback. */ }
    </script>
    <div id="boot-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gaea · 多功能 AI 助手</title>
    <style>
      /* ── 静态启动屏（JS bundle 加载期遮罩，React 挂载后由 BootSplash 接管移除）──
         与 BootSplash 同视觉语言：深空 aurora + 呼吸光环 + gaea 徽记 + 进度微光。
         纯 CSS，零依赖；reduced-motion 下仅静态呈现。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(ellipse 90% 60% at 70% -10%, rgba(45, 212, 191, 0.16), transparent 60%),
          radial-gradient(ellipse 80% 55% at 15% 110%, rgba(20, 184, 166, 0.14), transparent 60%),
          #06090c;
        color: #e2e8f0;
        font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #boot-splash .bs-ring {
        position: relative;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash .bs-ring::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 300deg, rgba(94, 234, 212, 0.9) 340deg, transparent 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: bs-spin 1.3s linear infinite;
      }
      #boot-splash .bs-ring::after {
        content: '';
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px solid rgba(94, 234, 212, 0.22);
        animation: bs-pulse 2.2s ease-in-out infinite;
      }
      #boot-splash .bs-orb {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 32% 28%, rgba(110, 231, 183, 0.28), rgba(4, 47, 46, 0.6) 70%);
        box-shadow: 0 0 32px rgba(94, 234, 212, 0.35), inset 0 0 18px rgba(94, 234, 212, 0.2);
      }
      #boot-splash .bs-orb img {
        width: 40px;
        height: 40px;
        filter: drop-shadow(0 0 8px rgba(94, 234, 212, 0.55));
      }
      #boot-splash .bs-word {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #e2e8f0;
        text-shadow: 0 0 18px rgba(94, 234, 212, 0.45);
      }
      #boot-splash .bs-bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
        overflow: hidden;
        position: relative;
      }
      #boot-splash .bs-bar::before {
        content: '';
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.85), transparent);
        animation: bs-shimmer 1.4s ease-in-out infinite;
      }
      #boot-splash .bs-tag {
        font-size: 11px;
        letter-spacing: 0.24em;
        color: rgba(148, 163, 184, 0.75);
      }
      /* ── 亮色主题启动分支（v4.351）──：下方内联脚本在 bundle 加载前预读
         localStorage 的 gaea-display-mode，亮色会话给 <html> 挂 data-bs-light，
         静态启动屏与 body 随之走浅色——此前亮色用户每次启动先看 ~2s 深空屏
         （变量由 App useEffect 首帧后才注入，静态期只能硬编码分支）。 */
      html[data-bs-light] body { background: #eef2f4; }
      html[data-bs-light] #boot-splash {
        background:
          radial-gradient(ellipse 90% 60% at 70% -10%, rgba(13, 148, 136, 0.10), transparent 60%),
          radial-gradient(ellipse 80% 55% at 15% 110%, rgba(13, 148, 136, 0.08), transparent 60%),
          #eef2f4;
        color: #1f2937;
      }
      html[data-bs-light] #boot-splash .bs-ring::before {
        background: conic-gradient(from 0deg, transparent 0 300deg, rgba(13, 148, 136, 0.85) 340deg, transparent 360deg);
      }
      html[data-bs-light] #boot-splash .bs-ring::after {
        border-color: rgba(13, 148, 136, 0.30);
      }
      html[data-bs-light] #boot-splash .bs-orb {
        background: radial-gradient(circle at 32% 28%, rgba(153, 246, 228, 0.65), rgba(204, 251, 241, 0.9) 70%);
        box-shadow: 0 0 24px rgba(13, 148, 136, 0.25), inset 0 0 14px rgba(13, 148, 136, 0.15);
      }
      html[data-bs-light] #boot-splash .bs-orb img { filter: drop-shadow(0 0 6px rgba(13, 148, 136, 0.4)); }
      html[data-bs-light] #boot-splash .bs-word {
        color: #0f172a;
        text-shadow: 0 0 14px rgba(13, 148, 136, 0.25);
      }
      html[data-bs-light] #boot-splash .bs-bar { background: rgba(100, 116, 139, 0.22); }
      html[data-bs-light] #boot-splash .bs-bar::before {
        background: linear-gradient(90deg, transparent, rgba(13, 148, 136, 0.75), transparent);
      }
      html[data-bs-light] #boot-splash .bs-tag { color: rgba(71, 85, 105, 0.8); }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      @keyframes bs-pulse {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes bs-shimmer {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-ring::before,
        #boot-splash .bs-ring::after,
        #boot-splash .bs-bar::before { animation: none; }
      }
    </style>
  </head>
  <body style="margin:0;background:var(--color-bg-layout,#06090c)">
    <script>try { performance.mark('gaea:boot') } catch { /* 忽略 */ }</script>
    <script>
      // 亮色主题启动预读（v4.351）：判定顺序逐字对齐 appStore.loadMode——
      // gaea-display-mode ∈ {light,dark,system}；缺失时旧布尔键（gaea-dark /
      // wubigork-dark，'0'=亮）兜底；仍缺失缺省 dark（与 loadMode 一致，不做
      // matchMedia 推断）。只挂属性，App 注入真令牌后静态屏被 BootSplash
      // 接管移除，属性无残留消费方。
      try {
        var m = '';
        try { m = localStorage.getItem('gaea-display-mode') || '' } catch (e) {}
        var light = m === 'light';
        if (!light && m === 'system') {
          try { light = !window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        }
        if (!light && m === '') {
          var legacy = '';
          try { legacy = localStorage.getItem('gaea-dark') ?? localStorage.getItem('wubigork-dark') ?? '' } catch (e) {}
          light = legacy === '0';
        }
        if (light) document.documentElement.setAttribute('data-bs-light', '');
      } catch (e) { /* 预读失败保持深色缺省 */ }
    </script>
    <div id="boot-splash" aria-hidden="true">
      <div class="bs-ring">
        <div class="bs-orb"><img src="/favicon.svg" alt="" width="40" height="40" /></div>
      </div>
      <div class="bs-word">gaea</div>
      <div class="bs-bar"></div>
      <div class="bs-tag">CONSTELLATION OS</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
